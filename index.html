<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dockyard Deception — Halloween 2026</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#01040b;color:#fff;font-family:system-ui,Arial,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#01040b;z-index:999999}
#box{text-align:center;padding:24px}
#box b{font-size:22px}
#box div{margin-top:8px;opacity:.75;font-size:13px;line-height:1.4}
</style>
</head>
<body>
<div id="boot"><div id="box"><b>Loading Halloween Night…</b><div>Dockyard Deception</div></div></div>
<script>
(async function () {
  const stamp = Date.now();
  const BASE_URL =
    'https://raw.githubusercontent.com/flaglermobilemarineservices/Dockyard-Deception-3d/backup-non-halloween-2026-09-22/index.html?v=' + stamp;
  const HALLOWEEN_URL =
    'https://raw.githubusercontent.com/flaglermobilemarineservices/Dockyard-Deception-3d/halloween-2026/halloween-mode.js?v=' + stamp;

  try {
    const [baseResponse, halloweenResponse] = await Promise.all([
      fetch(BASE_URL, { cache: 'no-store' }),
      fetch(HALLOWEEN_URL, { cache: 'no-store' })
    ]);

    if (!baseResponse.ok) {
      throw new Error('Normal game request failed: ' + baseResponse.status);
    }
    if (!halloweenResponse.ok) {
      throw new Error('Halloween mode request failed: ' + halloweenResponse.status);
    }

    let html = await baseResponse.text();
    let halloweenCode = await halloweenResponse.text();

    // Halloween-only asset URLs are handled inside halloween-mode.js.

    if (!halloweenCode.includes('__DOCKYARD_HALLOWEEN_ACTIVE')) {
      throw new Error('Halloween mode file loaded, but it does not look like the expected build.');
    }

    // IMPORTANT: keep this split so the wrapper's own HTML parser never sees
    // a literal closing-script tag inside this script block.
    const closeScript = '</scr' + 'ipt>';
    const mainScriptEnd = html.lastIndexOf(closeScript);

    if (mainScriptEnd < 0) {
      throw new Error('Could not locate the normal game main script.');
    }

    // Inject INTO the normal game's final inline script, not as a separate
    // script tag. This lets halloween-mode.js see scene, renderer, controller,
    // gltfLoader, Gage state, music state, etc. from the main game scope.
    const injected =
      '\n\n/* ===== HALLOWEEN 2026 INLINE INJECTION START ===== */\n' +
      halloweenCode +
      '\n/* ===== HALLOWEEN 2026 INLINE INJECTION END ===== */\n' +
      "\nsetTimeout(function(){if(!window.__DOCKYARD_HALLOWEEN_ACTIVE||!document.getElementById('halloweenHud')){var d=document.createElement('div');d.style.cssText='position:fixed;left:8px;top:8px;z-index:999999;background:#6b0011;color:#fff;padding:10px 12px;border-radius:8px;font:700 12px system-ui';d.textContent='HALLOWEEN PATCH LOADED BUT DID NOT INITIALIZE';document.body.appendChild(d)}},2500);\n";

    html = html.slice(0, mainScriptEnd) + injected + html.slice(mainScriptEnd);

    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    console.error(err);
    document.getElementById('box').innerHTML =
      '<b>Halloween build could not load.</b>' +
      '<div>' + String(err && (err.message || err)) + '</div>' +
      '<div>Refresh once. If this remains, send me a screenshot of this message.</div>';
  }
})();
</script>
</body>
</html>
