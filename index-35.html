<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dockyard Deception — Halloween 2026</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#01040b;color:#fff;font-family:system-ui,Arial,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#01040b;z-index:999999}
#box{text-align:center;padding:24px}
#box b{font-size:22px}
#box div{margin-top:8px;opacity:.75;font-size:13px}
</style>
</head>
<body>
<div id="boot"><div id="box"><b>Loading Halloween Night…</b><div>Dockyard Deception</div></div></div>

<script>
(async function () {
  const SOURCE =
    'https://raw.githubusercontent.com/flaglermobilemarineservices/Dockyard-Deception-3d/backup-non-halloween-2026-09-22/index.html';

  try {
    const response = await fetch(SOURCE, { cache: 'no-store' });
    if (!response.ok) throw new Error('Backup index request failed: ' + response.status);

    let html = await response.text();

    // Load Halloween mode AFTER the normal game's existing code.
    const halloweenTag = '<script src="halloween-mode.js"><\/script>';

    if (!html.includes('halloween-mode.js')) {
      if (/<\/body>/i.test(html)) {
        html = html.replace(/<\/body>/i, halloweenTag + '\n</body>');
      } else {
        html += '\n' + halloweenTag;
      }
    }

    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    console.error(err);
    document.getElementById('box').innerHTML =
      '<b>Halloween build could not load.</b>' +
      '<div>' + String(err.message || err) + '</div>';
  }
})();
</script>
</body>
</html>
